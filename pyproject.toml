[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-microsoft-foundry"
version = "0.1.1"
description = "LLM plugin for Microsoft Foundry models, authenticated via Azure CLI"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "llm>=0.19",
    "httpx>=0.27",
    "azure-identity>=1.16",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.entry-points."llm"]
microsoft_foundry = "llm_microsoft_foundry"

[project.urls]
Homepage = "https://github.com/stefanstranger/llm-microsoft-foundry"
Issues   = "https://github.com/stefanstranger/llm-microsoft-foundry/issues"

[tool.setuptools]
py-modules = ["llm_microsoft_foundry"]
